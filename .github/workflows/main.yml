name: CI/CD + GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos obligatorios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar ejecuciones concurrentes
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Integración Continua - Validación de Archivos
    # Solo ejecuta CI en push o PR
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar existencia de archivos
        run: |
          for file in home.html styles.css login.html listadoUsuarios.html; do
            if [ -f "$file" ]; then
              echo "✅ $file encontrado"
            else
              echo "❌ ERROR: $file no encontrado"
              exit 1
            fi
          done

      - name: Validar estructura HTML básica
        run: |
          for file in home.html login.html listadoUsuarios.html; do
            if grep -q "<!DOCTYPE html>" "$file"; then
              echo "✅ $file tiene DOCTYPE"
            else
              echo "⚠️  $file podría mejorar su estructura"
            fi
          done

  deploy-pages:
    runs-on: ubuntu-latest
    name: Despliegue Real a GitHub Pages
    needs: ci
    # Solo despliega en push a main (no en PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Preparar artefactos (opcional, pero recomendado)
        run: |
          mkdir -p dist
          cp home.html styles.css login.html listadoUsuarios.html dist/
          echo "📦 Artefactos listos en carpeta dist/"

      - name: Subir artefacto a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'  # Cambia a '.' si quieres subir todo el repo raíz

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4