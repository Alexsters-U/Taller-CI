<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión de Usuarios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Sistema de Gestión</h1>
            <ul class="nav-links">
                <li><a href="home.html">Inicio</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="listadoUsuarios.html">Usuarios</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">Iniciar Sesión</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario" 
                        placeholder="Ingresa tu usuario" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Ingresa tu contraseña" 
                        required
                    >
                </div>

                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="display: flex; align-items: center; margin: 0;">
                        <input type="checkbox" name="remember" id="remember" style="width: auto; margin-right: 0.5rem;">
                        Recuérdame
                    </label>
                    <a href="#" style="color: #3498db; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Iniciar Sesión
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; color: #666;">
                <p>¿No tienes cuenta? <a href="#" style="color: #3498db; text-decoration: none;">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Sistema de Gestión de Usuarios. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            
            if (usuario && password) {
                alert('Bienvenido ' + usuario + '! (Esta es una demostración)');
                // En una aplicación real, aquí iría la validación con el servidor
            }
        });
    </script>
</body>
</html>
